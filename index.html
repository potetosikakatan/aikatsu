<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アイカツカード帳</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-gray-800 pb-20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const SUPABASE_URL = 'https://gpjcwjijixsamjjwxnw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwamN3amlqaXh5c2Ftamp3eG53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMzY5ODEsImV4cCI6MjEwNjkxMjk4MX0.efXns_bbYBZrMgWR8revaEUGwc_dyHZgQJ5VxZuuSpc';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const THEMES = {
      pink: { bg: 'bg-pink-50', primary: 'bg-pink-500', text: 'text-pink-500', border: 'border-pink-200', activeTab: 'bg-pink-500 text-white' },
      lavender: { bg: 'bg-purple-50', primary: 'bg-purple-500', text: 'text-purple-500', border: 'border-purple-200', activeTab: 'bg-purple-500 text-white' },
      blue: { bg: 'bg-sky-50', primary: 'bg-sky-500', text: 'text-sky-500', border: 'border-sky-200', activeTab: 'bg-sky-500 text-white' },
      mint: { bg: 'bg-emerald-50', primary: 'bg-emerald-500', text: 'text-emerald-500', border: 'border-emerald-200', activeTab: 'bg-emerald-500 text-white' },
      orange: { bg: 'bg-orange-50', primary: 'bg-orange-500', text: 'text-orange-500', border: 'border-orange-200', activeTab: 'bg-orange-500 text-white' },
      gray: { bg: 'bg-gray-100', primary: 'bg-gray-700', text: 'text-gray-700', border: 'border-gray-300', activeTab: 'bg-gray-700 text-white' },
    };

    function App() {
      const [cards, setCards] = useState([]);
      const [shops, setShops] = useState([]);
      const [seqLogs, setSeqLogs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('cards'); // 'cards' | 'trade' | 'coord' | 'shops' | 'sequence' | 'settings'
      const [theme, setTheme] = useState('pink');

      // Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('すべて');
      const [rarityFilter, setRarityFilter] = useState('すべて');

      // Modals & Refs
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isShopModalOpen, setIsShopModalOpen] = useState(false);
      const [copiedText, setCopiedText] = useState(false);
      const tradeImageRef = useRef(null);

      const [newCard, setNewCard] = useState({ card_id: '', name: '', rarity: 'PR', category: 'トップス', coord: '', img_url: '' });
      const [newShop, setNewShop] = useState({ name: '', address: '', machine_count: 1, memo: '' });

      const fetchCards = async () => {
        setLoading(true);
        const { data } = await supabase.from('cards').select('*').order('card_id', { ascending: true });
        if (data) setCards(data);
        setLoading(false);
      };

      useEffect(() => {
        fetchCards();
        const savedShops = localStorage.getItem('aikatsu_shops');
        if (savedShops) setShops(JSON.parse(savedShops));
        const savedSeq = localStorage.getItem('aikatsu_seq');
        if (savedSeq) setSeqLogs(JSON.parse(savedSeq));
      }, []);

      const saveShopsToLocal = (newShops) => {
        setShops(newShops);
        localStorage.setItem('aikatsu_shops', JSON.stringify(newShops));
      };

      const saveSeqToLocal = (newSeq) => {
        setSeqLogs(newSeq);
        localStorage.setItem('aikatsu_seq', JSON.stringify(newSeq));
      };

      const themeStyle = THEMES[theme] || THEMES.pink;

      // Card Updates
      const updateCardState = async (id, fields) => {
        setCards(prev => prev.map(c => c.id === id ? { ...c, ...fields } : c));
        await supabase.from('cards').update(fields).eq('id', id);
      };

      const handleAddCard = async (e) => {
        e.preventDefault();
        if (!newCard.card_id || !newCard.name) return;
        const { data, error } = await supabase.from('cards').insert([{ ...newCard, count: 0, give: 0, want: false }]).select();
        if (!error && data) {
          setCards([...cards, data[0]]);
          setIsAddModalOpen(false);
          setNewCard({ card_id: '', name: '', rarity: 'PR', category: 'トップス', coord: '', img_url: '' });
        }
      };

      const handleAddShop = (e) => {
        e.preventDefault();
        if (!newShop.name) return;
        const updated = [...shops, { ...newShop, id: Date.now(), isFavorite: false }];
        saveShopsToLocal(updated);
        setIsShopModalOpen(false);
        setNewShop({ name: '', address: '', machine_count: 1, memo: '' });
      };

      const toggleShopFav = (id) => {
        const updated = shops.map(s => s.id === id ? { ...s, isFavorite: !s.isFavorite } : s);
        saveShopsToLocal(updated);
      };

      const deleteShop = (id) => {
        saveShopsToLocal(shops.filter(s => s.id !== id));
      };

      const addSeqLog = (card) => {
        saveSeqToLocal([...seqLogs, { ...card, loggedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]);
      };

      // Generate Trade Text
      const getTradeText = () => {
        const wants = cards.filter(c => c.want).map(c => `【求】${c.card_id} ${c.name}`).join('\n');
        const gives = cards.filter(c => c.give > 0).map(c => `【譲】${c.card_id} ${c.name} (x${c.give})`).join('\n');
        return `【アイカツカード 交換募集】\n\n${wants}\n\n${gives}\n\nお気軽にお声がけください！✨`;
      };

      const copyTradeText = () => {
        navigator.clipboard.writeText(getTradeText());
        setCopiedText(true);
        setTimeout(() => setCopiedText(false), 2000);
      };

      // Export Image
      const exportTradeImage = () => {
        if (!tradeImageRef.current) return;
        html2canvas(tradeImageRef.current).then(canvas => {
          const link = document.createElement('a');
          link.download = 'aikatsu_trade_list.png';
          link.href = canvas.toDataURL();
          link.click();
        });
      };

      // Filters & Aggregations
      const filteredCards = useMemo(() => {
        return cards.filter(card => {
          const matchQuery = card.name.includes(searchQuery) || card.card_id.includes(searchQuery) || (card.coord && card.coord.includes(searchQuery));
          const matchCategory = categoryFilter === 'すべて' || card.category === categoryFilter;
          const matchRarity = rarityFilter === 'すべて' || card.rarity === rarityFilter;
          return matchQuery && matchCategory && matchRarity;
        });
      }, [cards, searchQuery, categoryFilter, rarityFilter]);

      const coordGroups = useMemo(() => {
        const groups = {};
        cards.forEach(card => {
          const coordName = card.coord || 'その他';
          if (!groups[coordName]) groups[coordName] = [];
          groups[coordName].push(card);
        });
        return groups;
      }, [cards]);

      const totalOwned = cards.filter(c => c.count > 0).length;
      const totalCards = cards.length;
      const progressPct = totalCards > 0 ? Math.round((totalOwned / totalCards) * 100) : 0;

      return (
        <div className={`min-h-screen ${themeStyle.bg} transition-colors duration-200`}>
          <div className="max-w-md mx-auto px-4 py-4">
            
            {/* Header */}
            <div className="flex justify-between items-center mb-4">
              <div className="flex items-center space-x-2">
                <span className={`w-8 h-8 rounded-xl ${themeStyle.primary} text-white flex items-center justify-center font-bold text-sm shadow-sm`}>
                  <i className="fa-solid fa-heart"></i>
                </span>
                <h1 className="text-lg font-extrabold text-gray-800">アイカツカード帳 ✨</h1>
              </div>
              <button onClick={() => setIsAddModalOpen(true)} className={`${themeStyle.primary} text-white px-3 py-1.5 rounded-xl font-bold text-xs shadow-sm flex items-center gap-1`}>
                <i className="fa-solid fa-plus"></i> カード追加
              </button>
            </div>

            {/* Navigation Tabs */}
            <div className="bg-white p-1 rounded-2xl shadow-sm border border-gray-100 flex justify-between mb-4 text-[11px] font-bold text-gray-500 overflow-x-auto">
              <button onClick={() => setActiveTab('cards')} className={`flex-1 py-2 px-1 rounded-xl transition whitespace-nowrap ${activeTab === 'cards' ? themeStyle.activeTab : ''}`}>
                <i className="fa-solid fa-layer-group mr-1"></i>カード
              </button>
              <button onClick={() => setActiveTab('trade')} className={`flex-1 py-2 px-1 rounded-xl transition whitespace-nowrap ${activeTab === 'trade' ? themeStyle.activeTab : ''}`}>
                <i className="fa-solid fa-right-left mr-1"></i>譲求トレード
              </button>
              <button onClick={() => setActiveTab('coord')} className={`flex-1 py-2 px-1 rounded-xl transition whitespace-nowrap ${activeTab === 'coord' ? themeStyle.activeTab : ''}`}>
                <i className="fa-solid fa-shirt mr-1"></i>コーデ
              </button>
              <button onClick={() => setActiveTab('shops')} className={`flex-1 py-2 px-1 rounded-xl transition whitespace-nowrap ${activeTab === 'shops' ? themeStyle.activeTab : ''}`}>
                <i className="fa-solid fa-store mr-1"></i>お店メモ
              </button>
              <button onClick={() => setActiveTab('sequence')} className={`flex-1 py-2 px-1 rounded-xl transition whitespace-nowrap ${activeTab === 'sequence' ? themeStyle.activeTab : ''}`}>
                <i className="fa-solid fa-list-ol mr-1"></i>配列
              </button>
              <button onClick={() => setActiveTab('settings')} className={`flex-1 py-2 px-1 rounded-xl transition whitespace-nowrap ${activeTab === 'settings' ? themeStyle.activeTab : ''}`}>
                <i className="fa-solid fa-gear mr-1"></i>設定
              </button>
            </div>

            {/* TAB 1: CARDS */}
            {activeTab === 'cards' && (
              <div>
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4">
                  <div className="flex justify-between items-baseline mb-1">
                    <span className="text-xs font-bold text-gray-400">コンプリート率</span>
                    <span className="text-xs font-bold text-gray-600">{totalOwned}/{totalCards} 種 ({progressPct}%)</span>
                  </div>
                  <div className="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden mb-3">
                    <div className={`h-2.5 ${themeStyle.primary} transition-all duration-300 rounded-full`} style={{ width: `${progressPct}%` }}></div>
                  </div>
                  <div className="flex justify-around text-center text-xs font-bold">
                    <div><div className="text-gray-400 text-[10px]">所持</div><div className="text-gray-700">{totalOwned}</div></div>
                    <div><div className="text-gray-400 text-[10px]">譲れる</div><div className="text-emerald-500">{cards.filter(c=>c.give>0).length}</div></div>
                    <div><div className="text-gray-400 text-[10px]">欲しい</div><div className="text-pink-500">{cards.filter(c=>c.want).length}</div></div>
                  </div>
                </div>

                {/* Filters */}
                <div className="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 mb-4 space-y-2">
                  <input
                    type="text"
                    placeholder="カードID・名前・コーデ名で検索..."
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    className="w-full bg-gray-50 text-xs px-3 py-2 rounded-xl border border-gray-100 focus:outline-none"
                  />
                  <div className="grid grid-cols-2 gap-2 text-xs font-bold text-gray-600">
                    <select value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)} className="bg-gray-50 p-2 rounded-xl border border-gray-100">
                      <option>すべて</option><option>トップス</option><option>ボトムス</option><option>シューズ</option><option>アクセサリー</option>
                    </select>
                    <select value={rarityFilter} onChange={e => setRarityFilter(e.target.value)} className="bg-gray-50 p-2 rounded-xl border border-gray-100">
                      <option>すべて</option><option>PR</option><option>R</option><option>N</option><option>CP</option>
                    </select>
                  </div>
                </div>

                {/* Card List */}
                {loading ? (
                  <div className="text-center py-10 text-gray-400 font-bold">読み込み中...</div>
                ) : filteredCards.length === 0 ? (
                  <div className="text-center py-10 text-gray-400 text-xs font-bold">該当するカードがありません</div>
                ) : (
                  <div className="grid grid-cols-2 gap-3">
                    {filteredCards.map(card => (
                      <div key={card.id} className="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex flex-col justify-between">
                        <div>
                          <div className="relative mb-2">
                            <img src={card.img_url || 'https://via.placeholder.com/150/f0f0f0/cccccc?text=No+Image'} className="w-full h-36 object-cover rounded-xl" />
                            {card.count === 0 && (
                              <span className="absolute top-2 left-2 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded-md font-bold">未所持</span>
                            )}
                          </div>
                          <div className="flex items-center space-x-1 mb-1">
                            <span className="font-bold text-xs">{card.card_id}</span>
                            <span className={`text-[9px] text-white px-1.5 py-0.5 rounded font-bold ${themeStyle.primary}`}>{card.rarity}</span>
                          </div>
                          <div className="text-xs font-bold text-gray-700 truncate mb-2">{card.name}</div>
                        </div>

                        <div className="space-y-1.5">
                          <div className="bg-gray-50 rounded-xl flex items-center justify-between p-1">
                            <button onClick={() => updateCardState(card.id, { count: Math.max(0, card.count - 1) })} className="w-6 h-6 bg-white shadow-xs rounded-lg text-gray-500 font-bold">-</button>
                            <span className="text-xs font-bold">{card.count} 枚</span>
                            <button onClick={() => updateCardState(card.id, { count: card.count + 1 })} className={`w-6 h-6 bg-white shadow-xs rounded-lg ${themeStyle.text} font-bold`}>+</button>
                          </div>

                          <div className="flex space-x-1">
                            <button 
                              onClick={() => updateCardState(card.id, { give: card.give > 0 ? 0 : 1 })}
                              className={`flex-1 py-1 rounded-lg text-[10px] font-bold border transition ${card.give > 0 ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-white text-gray-400 border-gray-200'}`}
                            >
                              譲 {card.give}
                            </button>
                            <button 
                              onClick={() => updateCardState(card.id, { want: !card.want })}
                              className={`flex-1 py-1 rounded-lg text-[10px] font-bold border transition ${card.want ? 'bg-pink-500 text-white border-pink-500' : 'bg-white text-gray-400 border-gray-200'}`}
                            >
                              ♡ 求
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: TRADE (求・譲リスト画像＆テキストコピー) */}
            {activeTab === 'trade' && (
              <div className="space-y-4">
                <div className="flex gap-2">
                  <button onClick={copyTradeText} className="flex-1 bg-white border border-gray-200 text-gray-700 py-2.5 rounded-2xl font-bold text-xs shadow-sm flex items-center justify-center gap-1.5">
                    <i className="fa-solid fa-copy"></i> {copiedText ? 'コピーしました！' : '文章をコピー'}
                  </button>
                  <button onClick={exportTradeImage} className={`flex-1 ${themeStyle.primary} text-white py-2.5 rounded-2xl font-bold text-xs shadow-sm flex items-center justify-center gap-1.5`}>
                    <i className="fa-solid fa-image"></i> 画像を保存
                  </button>
                </div>

                {/* Trade Preview Canvas */}
                <div ref={tradeImageRef} className="bg-white p-4 rounded-3xl border border-gray-200 shadow-sm space-y-4">
                  <div className="text-center border-b pb-2">
                    <h2 className="font-extrabold text-gray-800 text-sm">✨ アイカツ！トレード募集リスト ✨</h2>
                  </div>

                  <div>
                    <h3 className="font-bold text-xs text-pink-500 mb-2 flex items-center gap-1">
                      <i className="fa-solid fa-heart"></i> 求めているカード ({cards.filter(c=>c.want).length})
                    </h3>
                    <div className="grid grid-cols-3 gap-2">
                      {cards.filter(c=>c.want).map(c => (
                        <div key={c.id} className="bg-pink-50/60 rounded-xl p-1.5 text-center">
                          <img src={c.img_url || 'https://via.placeholder.com/80'} className="w-full h-16 object-cover rounded-lg mb-1" />
                          <div className="text-[9px] font-bold text-pink-600 truncate">{c.card_id}</div>
                          <div className="text-[8px] text-gray-600 truncate">{c.name}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div>
                    <h3 className="font-bold text-xs text-emerald-500 mb-2 flex items-center gap-1">
                      <i className="fa-solid fa-right-left"></i> 譲れるカード ({cards.filter(c=>c.give>0).length})
                    </h3>
                    <div className="grid grid-cols-3 gap-2">
                      {cards.filter(c=>c.give>0).map(c => (
                        <div key={c.id} className="bg-emerald-50/60 rounded-xl p-1.5 text-center">
                          <img src={c.img_url || 'https://via.placeholder.com/80'} className="w-full h-16 object-cover rounded-lg mb-1" />
                          <div className="text-[9px] font-bold text-emerald-600 truncate">{c.card_id} (×{c.give})</div>
                          <div className="text-[8px] text-gray-600 truncate">{c.name}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: COORDINATE */}
            {activeTab === 'coord' && (
              <div className="space-y-4">
                {Object.entries(coordGroups).map(([coordName, groupCards]) => {
                  const ownedCount = groupCards.filter(c=>c.count>0).length;
                  const isComplete = ownedCount === groupCards.length;

                  return (
                    <div key={coordName} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                      <div className="flex justify-between items-center mb-3">
                        <h3 className="font-bold text-sm text-gray-800">{coordName}</h3>
                        <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full ${isComplete ? 'bg-emerald-100 text-emerald-600' : 'bg-gray-100 text-gray-500'}`}>
                          {isComplete ? '✨ 揃っています！' : `あと ${groupCards.length - ownedCount} 枚`}
                        </span>
                      </div>
                      <div className="grid grid-cols-4 gap-2">
                        {groupCards.map(c => (
                          <div key={c.id} className="text-center">
                            <img src={c.img_url || 'https://via.placeholder.com/100'} className={`w-full h-20 object-cover rounded-lg mb-1 ${c.count === 0 ? 'opacity-30 grayscale' : ''}`} />
                            <div className="text-[9px] font-bold text-gray-500 truncate">{c.card_id}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* TAB 4: SHOPS (お店メモ・あそべるお店) */}
            {activeTab === 'shops' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="font-bold text-sm text-gray-700">あそべるお店メモ ({shops.length})</h2>
                  <button onClick={() => setIsShopModalOpen(true)} className={`${themeStyle.primary} text-white px-3 py-1.5 rounded-xl font-bold text-xs shadow-sm`}>
                    + お店を追加
                  </button>
                </div>

                {shops.length === 0 ? (
                  <div className="bg-white rounded-2xl p-6 text-center text-gray-400 text-xs font-bold">
                    登録されているお店がありません
                  </div>
                ) : (
                  <div className="space-y-3">
                    {shops.map(shop => (
                      <div key={shop.id} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 relative">
                        <div className="flex justify-between items-start mb-1">
                          <div className="flex items-center gap-1.5">
                            <button onClick={() => toggleShopFav(shop.id)} className={`text-sm ${shop.isFavorite ? 'text-amber-400' : 'text-gray-300'}`}>
                              ★
                            </button>
                            <h3 className="font-bold text-sm text-gray-800">{shop.name}</h3>
                          </div>
                          <button onClick={() => deleteShop(shop.id)} className="text-gray-300 hover:text-red-400 text-xs">
                            <i className="fa-solid fa-trash"></i>
                          </button>
                        </div>
                        {shop.address && (
                          <p className="text-[11px] text-gray-500 mb-2 flex items-center gap-1">
                            <i className="fa-solid fa-location-dot text-gray-400"></i> {shop.address}
                          </p>
                        )}
                        <div className="flex items-center gap-3 text-xs font-bold text-gray-600 bg-gray-50 p-2 rounded-xl">
                          <span>🎮 台数: {shop.machine_count} 台</span>
                          {shop.memo && <span className="text-gray-500 font-normal">📝 {shop.memo}</span>}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 5: SEQUENCE (配列記録) */}
            {activeTab === 'sequence' && (
              <div className="space-y-4">
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-sm text-gray-800">排出ログ ({seqLogs.length} 枚)</h3>
                    <button onClick={() => saveSeqToLocal([])} className="text-xs text-red-400 font-bold">クリア</button>
                  </div>
                  
                  {/* Sequence History */}
                  <div className="flex gap-2 overflow-x-auto pb-2">
                    {seqLogs.length === 0 ? (
                      <div className="text-xs text-gray-400 font-bold py-2">カードを選択して排出順を記録します</div>
                    ) : (
                      seqLogs.map((log, index) => (
                        <div key={index} className="flex-shrink-0 w-16 bg-gray-50 rounded-xl p-1 text-center border border-gray-100">
                          <div className="text-[9px] font-bold text-gray-400 mb-0.5">#{index + 1}</div>
                          <img src={log.img_url || 'https://via.placeholder.com/50'} className="w-12 h-16 object-cover rounded-md mx-auto mb-1" />
                          <div className="text-[8px] font-bold text-gray-700 truncate">{log.card_id}</div>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-2">
                  <h3 className="font-bold text-xs text-gray-500 mb-2">排出されたカードをタップして記録</h3>
                  <div className="grid grid-cols-3 gap-2 max-h-80 overflow-y-auto p-1">
                    {cards.map(c => (
                      <button key={c.id} onClick={() => addSeqLog(c)} className="bg-gray-50 p-2 rounded-xl text-left hover:bg-gray-100 transition">
                        <div className="text-[9px] font-bold text-gray-400">{c.card_id}</div>
                        <div className="text-xs font-bold text-gray-800 truncate">{c.name}</div>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 6: SETTINGS */}
            {activeTab === 'settings' && (
              <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-4">
                <h3 className="font-bold text-sm text-gray-800">アプリ設定</h3>
                <div>
                  <label className="text-xs font-bold text-gray-500 block mb-2">テーマカラー変更</label>
                  <div className="grid grid-cols-3 gap-2">
                    {Object.keys(THEMES).map(tName => (
                      <button
                        key={tName}
                        onClick={() => setTheme(tName)}
                        className={`py-2 rounded-xl font-bold text-xs capitalize border transition ${theme === tName ? 'border-gray-800 shadow-sm' : 'border-gray-100'}`}
                      >
                        {tName}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Modal: Add Card */}
            {isAddModalOpen && (
              <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-3xl p-5 w-full max-w-sm shadow-xl relative">
                  <button onClick={() => setIsAddModalOpen(false)} className="absolute top-4 right-4 text-gray-400">✕</button>
                  <h3 className="font-bold text-lg mb-4">カード新規登録</h3>
                  <form onSubmit={handleAddCard} className="space-y-3 text-xs font-bold text-gray-600">
                    <input type="text" placeholder="カード番号 (例: E1-01)" value={newCard.card_id} onChange={e=>setNewCard({...newCard, card_id: e.target.value})} className="w-full p-2.5 rounded-xl border bg-gray-50" required />
                    <input type="text" placeholder="カード名" value={newCard.name} onChange={e=>setNewCard({...newCard, name: e.target.value})} className="w-full p-2.5 rounded-xl border bg-gray-50" required />
                    <input type="text" placeholder="コーデ名 (例: オーロラキス)" value={newCard.coord} onChange={e=>setNewCard({...newCard, coord: e.target.value})} className="w-full p-2.5 rounded-xl border bg-gray-50" />
                    <div className="grid grid-cols-2 gap-2">
                      <select value={newCard.category} onChange={e=>setNewCard({...newCard, category: e.target.value})} className="p-2.5 rounded-xl border bg-gray-50">
                        <option>トップス</option><option>ボトムス</option><option>シューズ</option><option>アクセサリー</option>
                      </select>
                      <select value={newCard.rarity} onChange={e=>setNewCard({...newCard, rarity: e.target.value})} className="p-2.5 rounded-xl border bg-gray-50">
                        <option>PR</option><option>R</option><option>N</option><option>CP</option>
                      </select>
                    </div>
                    <input type="text" placeholder="画像URL (任意)" value={newCard.img_url} onChange={e=>setNewCard({...newCard, img_url: e.target.value})} className="w-full p-2.5 rounded-xl border bg-gray-50" />
                    <button type="submit" className={`w-full ${themeStyle.primary} text-white py-3 rounded-xl font-bold`}>登録する</button>
                  </form>
                </div>
              </div>
            )}

            {/* Modal: Add Shop */}
            {isShopModalOpen && (
              <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-3xl p-5 w-full max-w-sm shadow-xl relative">
                  <button onClick={() => setIsShopModalOpen(false)} className="absolute top-4 right-4 text-gray-400">✕</button>
                  <h3 className="font-bold text-lg mb-4">お店を登録</h3>
                  <form onSubmit={handleAddShop} className="space-y-3 text-xs font-bold text-gray-600">
                    <input type="text" placeholder="店名 (例: モーリーファンタジー〇〇店)" value={newShop.name} onChange={e=>setNewShop({...newShop, name: e.target.value})} className="w-full p-2.5 rounded-xl border bg-gray-50" required />
                    <input type="text" placeholder="住所・アクセス" value={newShop.address} onChange={e=>setNewShop({...newShop, address: e.target.value})} className="w-full p-2.5 rounded-xl border bg-gray-50" />
                    <div className="flex items-center gap-2">
                      <label>筐体台数:</label>
                      <input type="number" min="1" value={newShop.machine_count} onChange={e=>setNewShop({...newShop, machine_count: parseInt(e.target.value) || 1})} className="w-20 p-2 rounded-xl border bg-gray-50" />
                    </div>
                    <textarea placeholder="メモ (例: 混雑状況、録画台の有無など)" value={newShop.memo} onChange={e=>setNewShop({...newShop, memo: e.target.value})} className="w-full p-2.5 rounded-xl border bg-gray-50 h-20" />
                    <button type="submit" className={`w-full ${themeStyle.primary} text-white py-3 rounded-xl font-bold`}>登録する</button>
                  </form>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
