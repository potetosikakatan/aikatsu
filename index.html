<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アイカツカード帳</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-pink-50 text-gray-800 pb-20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://gpjcwjijixsamjjwxnw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwamN3amlqaXh5c2Ftamp3eG53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMzY5ODEsImV4cCI6MjEwNjkxMjk4MX0.efXns_bbYBZrMgWR8revaEUGwc_dyHZgQJ5VxZuuSpc';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function App() {
      const [cards, setCards] = useState([]);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [loading, setLoading] = useState(true);

      const [newCard, setNewCard] = useState({
        card_id: '', name: '', rarity: 'PR', category: 'トップス', coord: '', img_url: ''
      });

      const fetchCards = async () => {
        setLoading(true);
        const { data, error } = await supabase.from('cards').select('*').order('created_at', { ascending: false });
        if (!error && data) setCards(data);
        setLoading(false);
      };

      useEffect(() => {
        fetchCards();
      }, []);

      const updateCount = async (id, delta, currentCount) => {
        const newCount = Math.max(0, currentCount + delta);
        setCards(cards.map(c => c.id === id ? { ...c, count: newCount } : c));
        await supabase.from('cards').update({ count: newCount }).eq('id', id);
      };

      const handleAddCard = async (e) => {
        e.preventDefault();
        if (!newCard.card_id || !newCard.name) return;

        const { data, error } = await supabase.from('cards').insert([{
          ...newCard,
          count: 0, give: 0, want: false
        }]).select();

        if (!error && data) {
          setCards([data[0], ...cards]);
          setIsAddModalOpen(false);
          setNewCard({ card_id: '', name: '', rarity: 'PR', category: 'トップス', coord: '', img_url: '' });
        }
      };

      return (
        <div className="max-w-md mx-auto bg-pink-50 min-h-screen px-4 py-4">
          <div className="flex justify-between items-center mb-4">
            <h1 className="text-xl font-bold text-gray-800">アイカツカード帳 ✦</h1>
            <button onClick={() => setIsAddModalOpen(true)} className="bg-pink-500 text-white px-3 py-1.5 rounded-xl font-bold text-xs shadow-sm">
              + カード追加
            </button>
          </div>

          {loading ? (
            <div className="text-center py-10 text-gray-400 font-bold">読み込み中...</div>
          ) : cards.length === 0 ? (
            <div className="text-center py-10 text-gray-400 text-xs">
              まだカードが登録されていません。<br/>右上から追加してください！
            </div>
          ) : (
            <div className="grid grid-cols-2 gap-3">
              {cards.map(card => (
                <div key={card.id} className="bg-white rounded-2xl p-3 shadow-sm border border-gray-50 flex flex-col justify-between">
                  <div>
                    <img src={card.img_url || 'https://via.placeholder.com/150/e0e0e0/ffffff?text=No+Image'} className="w-full h-40 object-cover rounded-xl mb-2" />
                    <div className="flex items-center space-x-1 mb-1">
                      <span className="font-bold text-xs">{card.card_id}</span>
                      <span className="bg-pink-500 text-white text-[10px] px-1 rounded font-bold">{card.rarity}</span>
                    </div>
                    <div className="text-xs font-semibold text-gray-700 truncate mb-2">{card.name}</div>
                  </div>

                  <div className="bg-pink-50 rounded-xl flex items-center justify-between p-1">
                    <button onClick={() => updateCount(card.id, -1, card.count)} className="w-7 h-7 bg-white rounded-lg text-pink-500 font-bold">-</button>
                    <span className="text-xs font-bold">{card.count} 枚</span>
                    <button onClick={() => updateCount(card.id, 1, card.count)} className="w-7 h-7 bg-white rounded-lg text-pink-500 font-bold">+</button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {isAddModalOpen && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-5 w-full max-w-sm shadow-xl relative">
                <button onClick={() => setIsAddModalOpen(false)} className="absolute top-4 right-4 text-gray-400">✕</button>
                <h3 className="font-bold text-lg mb-4">カード登録</h3>
                <form onSubmit={handleAddCard} className="space-y-3 text-xs font-bold text-gray-600">
                  <input type="text" placeholder="カード番号 (例: E1-01)" value={newCard.card_id} onChange={e=>setNewCard({...newCard, card_id: e.target.value})} className="w-full p-2.5 rounded-xl border bg-gray-50" required />
                  <input type="text" placeholder="カード名" value={newCard.name} onChange={e=>setNewCard({...newCard, name: e.target.value})} className="w-full p-2.5 rounded-xl border bg-gray-50" required />
                  <input type="text" placeholder="画像URL (任意)" value={newCard.img_url} onChange={e=>setNewCard({...newCard, img_url: e.target.value})} className="w-full p-2.5 rounded-xl border bg-gray-50" />
                  <button type="submit" className="w-full bg-pink-500 text-white py-3 rounded-xl font-bold">登録する</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
